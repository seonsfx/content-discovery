include:
  - project: "observability/shared/gitlab-jobs"
    ref: 1.0.65
    file: "sast-scan-template.yml"
  - template: 'Workflows/MergeRequest-Pipelines.gitlab-ci.yml'

stages:
  - code_analysis
  - validate-content
  - O11y-Out-of-the-Box-Inventory
  - public-catalog

validate:
  stage: validate-content
  except:
    - schedules
  script:
    - CI_MR_TARGET_BRANCH=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME /bin/bash scripts/validate_content.sh

validate-public-catalog:
  stage: validate-content
  image: docker.repo.splunkdev.net/ci-cd/ci-container/python-3.12-bookworm:3.6.0
  script:
    - bash gitlab-ci/validate-public-catalog.sh

# GitLab remains authoritative. These jobs publish a read-only, sanitized
# catalog to GitHub; only paths accepted by validate-public-catalog.sh can
# reach the public repository.
.public-catalog-mirror-base:
  stage: public-catalog
  # Vetted, versioned internal image. Do not install publishing tools at runtime:
  # changes to this image version must be reviewed as publishing-code changes.
  image: docker.repo.splunkdev.net/ci-cd/ci-container/python-3.12-bookworm:3.6.0
  resource_group: public-catalog-mirror
  variables:
    GIT_STRATEGY: clone
    MIRROR_TARGET_REPO: "splunk/content-discovery"
  before_script:
    - |
      for required_tool in bash git curl openssl tar python3; do
        command -v "${required_tool}" >/dev/null 2>&1 || {
          printf 'ERROR: vetted mirror image is missing required tool: %s\n' "${required_tool}" >&2
          exit 1
        }
      done
    - test -n "${PIPELINE_GITHUB_APP_ID:-}"
    - test -n "${PIPELINE_GITHUB_APP_PRIVATE_KEY:-}"
    - mkdir -p "${CI_PROJECT_DIR}/.ci-secrets"
    - chmod 0700 "${CI_PROJECT_DIR}/.ci-secrets"
    - |
      if [ -f "${PIPELINE_GITHUB_APP_PRIVATE_KEY}" ]; then
        cp "${PIPELINE_GITHUB_APP_PRIVATE_KEY}" "${CI_PROJECT_DIR}/.ci-secrets/github-app.pem"
      else
        printf '%s' "${PIPELINE_GITHUB_APP_PRIVATE_KEY}" | base64 -d > "${CI_PROJECT_DIR}/.ci-secrets/github-app.pem"
      fi
    - chmod 0600 "${CI_PROJECT_DIR}/.ci-secrets/github-app.pem"
    - export GITHUB_APP_ID="${PIPELINE_GITHUB_APP_ID}"
    - export GITHUB_APP_PRIVATE_KEY_FILE="${CI_PROJECT_DIR}/.ci-secrets/github-app.pem"
    - export GITHUB_APP_INSTALLATION_ID="${PIPELINE_GITHUB_APP_INSTALLATION_ID:-}"
  after_script:
    - rm -rf "${CI_PROJECT_DIR}/.ci-secrets"

# Steady state is dormant until explicitly armed after the first cutover.
# It refuses any non-fast-forward update.
public-catalog-mirror:
  extends: .public-catalog-mirror-base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$PIPELINE_GITHUB_MIRROR_PUSH_ENABLED != "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "master" && $PIPELINE_GITHUB_APP_ID'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "master" && $PIPELINE_GITHUB_APP_ID'
  script:
    - bash gitlab-ci/github-mirror-push.sh
    - bash gitlab-ci/github-mirror-verify.sh

# First publication and allowlist changes rewrite public history and therefore
# require an explicit, manual cutover.
public-catalog-mirror-cutover:
  extends: .public-catalog-mirror-base
  variables:
    MIRROR_ALLOW_NON_FF: "1"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "master" && $PIPELINE_GITHUB_APP_ID'
      when: manual
      allow_failure: true
  script:
    - bash gitlab-ci/github-mirror-push.sh
    - bash gitlab-ci/github-mirror-verify.sh

update-ootb-inventory:
  image: python:3
  stage: O11y-Out-of-the-Box-Inventory
  # To run this job to just only on master branch
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: never
  script:
    - pip install -r requirement.txt
    - python o11y_ootb_inventory.py -ti $MS_TENANT_ID -mci $MS_CLIENT_ID -mcs $MS_CLIENT_SECRET -gdi $MS_GRAPH_DRIVE_ID -gii $MS_GRAPH_ITEM_ID -gpt $GITLAB_API_PRIVATE_TOKEN


variables:
  USER_OR_ORG_NAME:
    value: "splunk"
    description: "Provide user name for which we need to use in GitHub API calls. Default: bkanzariya"
  GITHUB_REPO_NAME:
    value: "o11y-gdi-metadata"
    description: "Provide GitHub repo name on which we need to commit yaml files. Default: bits-test"
  BRANCH_NAME:
    value: "bits-o11y-doc-automation"
    description: "Provide Branch name on which yaml files needs to be committed. Default: o11y-doc-automation"
  GITHUB_FOLDER_NAME:
    value: "ootb"
    description: "Provide folder/path on which yaml files needs to be committed. Please add '-' (dash) in case to commit file on root/main folder  Default: ootb "
