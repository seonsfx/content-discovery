include:
  - project: "observability/shared/gitlab-jobs"
    ref: 1.0.65
    file: "sast-scan-template.yml"
  - template: 'Workflows/MergeRequest-Pipelines.gitlab-ci.yml'

stages:
  - code_analysis
  - validate-content

validate:
  stage: validate-content
  except:
    - schedules
  script:
    - CI_MR_TARGET_BRANCH=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME /bin/bash scripts/validate_content.sh
